name: Deploy Angular app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Install dependencies
        working-directory: angular
        run: npm ci

      # /FuelScan/ mora da odgovara imenu GitHub repozitorijuma
      # (https://<username>.github.io/<repo-name>/). Ako repo ikad promeni ime,
      # izmeniti --base-href ovde.
      - name: Build (production)
        working-directory: angular
        run: npx ng build --configuration production --base-href /FuelScan/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: angular/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
