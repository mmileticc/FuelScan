<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <title>FuelScan</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <meta name="description" content="FuelScan - skenirajte QR kod sa računa za gorivo i pratite troškove i potrošnju.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16x16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

</head>
<body class="bg-surface text-slate-100 font-display h-[100dvh] w-full flex flex-col select-none overflow-hidden">
  <!--
    Statički fallback sadržaj unutar <app-root> - Angular ga ZAMENI čim se
    aplikacija pokrene (uobičajen "loading placeholder" obrazac), ali dok se
    to ne desi (ili ako neki alat/bot ne izvršava JavaScript, npr. Google-ov
    automatski proveravač Homepage URL-a za OAuth consent screen), ovaj tekst
    je ono što se stvarno vidi u sirovom HTML-u - zato mora jasno da objasni
    svrhu aplikacije i da sadrži link ka politici privatnosti.
  -->
  <app-root>
    <div style="max-width: 480px; margin: 3rem auto; padding: 0 1.25rem; text-align: center;">
      <h1 style="font-size: 1.5rem; font-weight: 800;">FuelScan</h1>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.75rem;">
        FuelScan je aplikacija za skeniranje QR koda sa fiskalnog računa za gorivo. Automatski
        izvlači podatke o stanici, količini i ceni goriva sa javnog portala Poreske uprave Srbije,
        i pomaže vam da pratite troškove i statistiku potrošnje goriva tokom vremena.
      </p>
      <p style="color: #64748b; font-size: 0.75rem; margin-top: 1.5rem;">
        <a href="privacy.html" style="color: #38bdf8;">Politika privatnosti</a>
      </p>
    </div>
  </app-root>
</body>
</html>
