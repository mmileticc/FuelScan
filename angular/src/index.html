<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <title>FuelScan</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <meta name="description" content="FuelScan - Scan fuel receipts and track your expenses automatically.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16x16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!--
    NAPOMENA: Tailwind je ovde učitan preko CDN Play skripte, identično kao
    u `old-vanilla/index.html`, radi vizuelnog identiteta bez dodatnog
    PostCSS build koraka. Za produkciju preporučeno je preći na
    `tailwindcss` npm paket + `tailwind.config.js` (Angular ga automatski
    detektuje), ali CDN varijanta radi bez izmena build pipeline-a.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fuel: { 50: "#f0f9ff", 100: "#e0f2fe", 400: "#38bdf8", 500: "#0ea5e9", 600: "#0284c7", 700: "#0369a1", 900: "#0c4a6e" },
            surface: { DEFAULT: "#0f172a", card: "#1e293b", border: "#334155" }
          },
          fontFamily: {
            display: ["DM Sans", "system-ui", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-slate-100 font-display h-[100dvh] w-full flex flex-col select-none overflow-hidden">
  <app-root></app-root>
</body>
</html>
