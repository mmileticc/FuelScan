<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stabilan Skener</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        
        /* Video okvir koji izgleda kao skener */
        #camera-preview { width: 100%; max-width: 500px; border: 2px solid #333; background: #000; border-radius: 8px; }
        
        /* Sakrivamo element koji biblioteka trazi za inicijalizaciju, jer nam treba samo za fajlove */
        #reader { width: 0; height: 0; overflow: hidden; }
        
        .controls { margin-top: 20px; }
        button { padding: 15px 25px; margin: 5px; font-size: 16px; cursor: pointer; }
        #result-box { margin-top: 20px; padding: 15px; border: 1px solid #ccc; word-break: break-all; }
    </style>
</head>
<body>

    <h1>Skener</h1>
    
    <video id="camera-preview" autoplay playsinline></video>
    <div id="reader"></div>

    <div class="controls">
        <button id="snap-btn">📸 OKINI KADAR</button>
        <button id="upload-btn">📁 UČITAJ SLIKU</button>
        <input type="file" id="file-input" style="display:none" accept="image/*">
    </div>

    <div id="result-box">
        <h3>Rezultat:</h3>
        <p id="result">Kamera je spremna...</p>
    </div>

    <script>
    const html5QrCode = new Html5Qrcode("reader");
    const resultElement = document.getElementById('result');
    const video = document.getElementById('camera-preview');

    // SIGURNOSNA PROVERA: Da li pretraživač uopšte dozvoljava kameru (traži HTTPS)
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { resultElement.innerText = "Kamera je blokirana u podešavanjima."; });
    } else {
        // Ako nema HTTPS-a, aplikacija neće pući, nego će te samo obavestiti
        resultElement.innerText = "⚠️ HTTP detektovan. Kamera je isključena, ali učitavanje iz fajla radi!";
        video.style.display = "none"; // Sakrivamo crni prozor za kameru
    }

    // ZAJEDNIČKA FUNKCIJA ZA ANALIZU
    function processImage(file) {
        resultElement.innerText = "Analiziram...";
        
        html5QrCode.scanFile(file, true)
            .then(decodedText => {
                const link = document.createElement('a');
                link.href = decodedText;
                link.innerText = decodedText;
                link.target = "_blank";
                
                resultElement.innerHTML = "";
                resultElement.appendChild(link);
            })
            .catch(err => {
                resultElement.innerText = "Nije pronađen QR kod na toj slici. Pokušaj ponovo.";
            });
    }

    // LOGIKA ZA DUGME "OKINI" (radiće samo ako radi i kamera)
    document.getElementById('snap-btn').addEventListener('click', () => {
        if (!video.srcObject) {
            alert("Kamera nije aktivna jer niste na HTTPS vezi!");
            return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(blob => {
            const file = new File([blob], "snapshot.jpg", { type: "image/jpeg" });
            processImage(file);
        }, 'image/jpeg');
    });

    // LOGIKA ZA DUGME "UČITAJ" (sada radi uvek, bez obzira na HTTP/HTTPS)
    document.getElementById('upload-btn').addEventListener('click', () => {
        document.getElementById('file-input').click();
    });

    document.getElementById('file-input').addEventListener('change', e => {
        if (e.target.files.length > 0) {
            processImage(e.target.files[0]);
        }
    });
</script>
</body>
</html>
